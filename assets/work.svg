<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected work"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#39d0d8"/></linearGradient></defs><g transform="translate(0,0)"><rect width="289.3333333333333" height="230" rx="12" fill="#0d1117" stroke="#30363d"/><rect width="289.3333333333333" height="3" rx="1.5" fill="url(#g)"/><text x="22" y="40" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2" fill="#39d0d8">AI · REAL-TIME</text><text x="22" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">AI Storyteller</text><text x="22" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">An AI game master that runs the night</text><text x="22" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">phase for Blood on the Clocktower:</text><text x="22" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">rules engine, 181 roles, live TV and</text><text x="22" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">phone clients for a table of players.</text><text x="22" y="210" font-family="Consolas, Menlo, monospace" font-size="12" fill="#58a6ff">Node · React 19 · WebSockets · LLM</text></g><g transform="translate(305.3333333333333,0)"><rect width="289.3333333333333" height="230" rx="12" fill="#0d1117" stroke="#30363d"/><rect width="289.3333333333333" height="3" rx="1.5" fill="url(#g)"/><text x="22" y="40" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2" fill="#39d0d8">FINTECH</text><text x="22" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Trading Signals</text><text x="22" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Momentum-based signal system for</text><text x="22" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Indian equities with a custom</text><text x="22" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">dashboard. Signals only, no</text><text x="22" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">auto-execution by design.</text><text x="22" y="210" font-family="Consolas, Menlo, monospace" font-size="12" fill="#58a6ff">Python · Dashboard · Data pipelines</text></g><g transform="translate(610.6666666666666,0)"><rect width="289.3333333333333" height="230" rx="12" fill="#0d1117" stroke="#30363d"/><rect width="289.3333333333333" height="3" rx="1.5" fill="url(#g)"/><text x="22" y="40" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2" fill="#39d0d8">ENTERPRISE</text><text x="22" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Enterprise Platform</text><text x="22" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Config-driven micro-frontend web</text><text x="22" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">platform at Tekion, where I lead</text><text x="22" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">front-end architecture decisions</text><text x="22" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">from intern to senior.</text><text x="22" y="210" font-family="Consolas, Menlo, monospace" font-size="12" fill="#58a6ff">React · TypeScript · Next.js</text></g></svg>