<rect width="900" height="280" rx="14" fill="#0d1117"/><rect width="900" height="280" rx="14" fill="url(#grid)"/><rect width="900" height="280" rx="14" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#30363d"/>
